name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test                      # unit + API integration + AI safety (vitest)
      - run: npm run build
      - run: npm run audit:deps            # fails on high/critical vulnerabilities in runtime deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e              # patient journey + axe WCAG 2.2 AA
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: ml/requirements.txt }
      - run: pip install -r requirements.txt pip-audit
      - run: python -m pytest tests -q
      - run: pip-audit -r requirements.txt  # dependency vulnerability scan

  release-gates:
    runs-on: ubuntu-latest
    needs: [web-api, ml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check-release-gates.js --target technical || echo "::warning::technical gates open — production deploy blocked"
      - run: node scripts/check-release-gates.js --target clinical || echo "::warning::clinical gates open — real-patient release blocked"
